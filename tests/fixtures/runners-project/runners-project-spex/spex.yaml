project_name: runners-project
cli_version: 0.10.5
layout: multi-repo
agent_root: .
description: >-
  Fixture for the check runners (regexp, glob, ast-grep, script) and the script
  run scopes (per-file, per-package, project), with intentional violations.
packages:
  - package_name: runners-project-api
    package_short_name: api
    path: ../runners-project-api
    rules:
      - regexp-runner
      - glob-runner
      - ast-grep-runner
      - script-runner
      - script-failures
  - package_name: runners-project-frontend
    package_short_name: frontend
    path: ../runners-project-frontend
    rules:
      - regexp-runner
      - glob-runner
      - ast-grep-runner
      - script-runner
  - package_name: runners-project-spex
    package_short_name: spex
    path: .
    rules: []
