id: script-runner
title: Script runner
description: >-
  Exercises the script runner at each run scope: per-file receives the matched
  files, per-package runs once in each package, project runs once overall.
acceptance_criteria:
  - "MUST keep a CHANGELOG.md in every package"
  - "MUST keep the api and frontend versions identical"
  - "MUST NOT leave a HACK marker in source code"
checks:
  - name: per-file-hack
    description: Flags a HACK marker left in source
    type: script
    run: per-file
    script: per-file-hack.sh
    include:
      - "src/**"
    exclude:
      - "src/generated/**"
    severity: warn
  - name: per-package-changelog
    description: Flags a package without a CHANGELOG.md
    type: script
    run: per-package
    script: per-package-changelog.sh
    severity: error
  - name: project-versions
    description: Flags api and frontend versions that differ
    type: script
    run: project
    script: project-versions.sh
    severity: error
