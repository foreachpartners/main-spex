project_name: dummy-project
cli_version: 0.8.8
layout: multi-repo
agent_root: .
description: >-
  Minimal dummy project used by spex's own test suite to exercise `spex check`
  and `spex coverage` on a project whose specs cover every lifecycle state.
prd: docs/prd.md
packages:
  - package_name: dummy-project-api
    package_short_name: api
    path: ../dummy-project-api
    contracts:
      - path: ./contracts.md
        description: Interface contract notes for the api.
    rules:
      - no-todo-comments
  - package_name: dummy-project-frontend
    package_short_name: frontend
    path: ../dummy-project-frontend
    rules: []
  - package_name: dummy-project-spex
    package_short_name: spex
    path: .
    rules: []
