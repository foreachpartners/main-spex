project_name: script-env-project
cli_version: 0.15.1
description: >-
  Fixture for the environment a script check runs in, at each run scope
  (per-file, per-repo, workspace).
repositories:
  - repository_name: script-env-project-api
    repository_short_name: api
    path: ../script-env-project-api
    rules:
      - spex-dir-env
  - repository_name: script-env-project-spex
    repository_short_name: spex
    path: .
    rules: []
