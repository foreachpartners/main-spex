id: spex-dir-env
title: Spex directory in the script environment
description: >-
  Every script check receives SPEX_DIR, the absolute path of the spex
  repository, whatever its run scope.
acceptance_criteria:
  - "MUST expose SPEX_DIR to a per-file script"
  - "MUST expose SPEX_DIR to a per-package script"
  - "MUST expose SPEX_DIR to a project script"
checks:
  - name: per-file
    description: Reports the SPEX_DIR a per-file script received
    type: script
    run: per-file
    script: report-spex-dir.sh
    include:
      - "src/**"
    severity: warn
  - name: per-package
    description: Reports the SPEX_DIR a per-package script received
    type: script
    run: per-package
    script: report-spex-dir.sh
    severity: warn
  - name: project
    description: Reports the SPEX_DIR a project script received
    type: script
    run: project
    script: report-spex-dir.sh
    severity: warn
