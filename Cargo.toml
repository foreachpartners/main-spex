[package]
name = "spex"
version = "0.10.5"
edition = "2024"
rust-version = "1.90"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
error-stack = "0.8.0"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
jsonschema = { version = "0.58.5", default-features = false }
regex = "1.13.1"
ignore = "0.4.33"
globset = "0.4.20"
include_dir = "0.7.4"
ast-grep-core = "0.45.3"
ast-grep-config = "0.45.3"
ast-grep-language = "0.45.3"
terminal_size = "0.4.4"
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
serial_test = "4.0.1"
indoc = "2.0.7"
