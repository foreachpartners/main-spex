[package]
name = "spex"
version = "0.6.15"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
error-stack = "0.7.1"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"
serde_json = "1.0.150"
jsonschema = { version = "0.46.5", default-features = false }
regex = "1.12.4"
ignore = "0.4.26"
globset = "0.4.18"
include_dir = "0.7.4"

[dev-dependencies]
tempfile = "3.27.0"
serial_test = "3.5.0"
indoc = "2.0.7"
