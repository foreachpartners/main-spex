[package]
name = "spex"
version = "0.8.9"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
error-stack = "0.8.0"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
jsonschema = { version = "0.56.0", default-features = false }
regex = "1.13.1"
ignore = "0.4.33"
globset = "0.4.20"
include_dir = "0.7.4"
ast-grep-core = "0.45.3"
ast-grep-config = "0.45.3"
ast-grep-language = "0.45.3"
terminal_size = "0.4.4"

[dev-dependencies]
tempfile = "3.27.0"
serial_test = "4.0.1"
indoc = "2.0.7"
