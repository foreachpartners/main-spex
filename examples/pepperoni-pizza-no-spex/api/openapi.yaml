openapi: 3.1.0
info:
  title: Pepperoni Pizza API
  version: 1.0.0
  description: Minimal pepperoni pizza shop API used as a spex example.
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /pizzas:
    get:
      operationId: listPizzas
      summary: List the pizza menu
      responses:
        "200":
          description: The pizzas available to order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pizza"
  /orders:
    post:
      operationId: createOrder
      summary: Order the pizzas in a cart and start a delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: The delivery that was started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /deliveries:
    get:
      operationId: listDeliveries
      summary: List the deliveries currently in progress
      description: >-
        A delivery is removed automatically 5 seconds after it is created, so
        clients poll this endpoint to keep their delivering view up to date.
      responses:
        "200":
          description: The deliveries still in progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
components:
  schemas:
    Pizza:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 1
        name:
          type: string
          examples:
            - Margherita
        price:
          type: number
          format: double
          examples:
            - 8.5
    NewOrder:
      type: object
      required:
        - pizzaIds
      properties:
        pizzaIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
          examples:
            - [1, 2]
    Delivery:
      type: object
      required:
        - id
        - items
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 1
        items:
          type: array
          items:
            type: string
          examples:
            - [Margherita, Pepperoni]
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          examples:
            - order must contain at least one pizza
