openapi: 3.1.0
info:
  title: Todo API
  version: 1.0.0
  description: Minimal todo list API used as a spex example.
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /todos:
    get:
      operationId: listTodos
      summary: List all todos
      responses:
        "200":
          description: The list of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
    post:
      operationId: createTodo
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTodo"
      responses:
        "201":
          description: The created todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /todos/{id}:
    parameters:
      - $ref: "#/components/parameters/TodoId"
    get:
      operationId: getTodo
      summary: Get a todo by id
      responses:
        "200":
          description: The requested todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "404":
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateTodo
      summary: Update a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTodo"
      responses:
        "200":
          description: The updated todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "404":
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTodo
      summary: Delete a todo
      responses:
        "204":
          description: Todo deleted
        "404":
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    TodoId:
      name: id
      in: path
      required: true
      description: Unique identifier of the todo
      schema:
        type: integer
        format: int64
  schemas:
    Todo:
      type: object
      required:
        - id
        - title
        - completed
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          examples:
            - 1
        title:
          type: string
          minLength: 1
          examples:
            - Buy milk
        completed:
          type: boolean
          examples:
            - false
    NewTodo:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          examples:
            - Buy milk
        completed:
          type: boolean
          default: false
    UpdateTodo:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        completed:
          type: boolean
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          examples:
            - Todo not found
