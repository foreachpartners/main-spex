project_name: pepperoni-pizza
description: >-
  Online pepperoni pizza ordering system built from a Rust API, an OpenAPI
  contract, and a React web client.
repositories:
  - repository_name: api
    description: Rust/Axum backend service that implements the pizza order API.
    path: ../api
    tech-specs:
      - TECH-COMMIT-MESSAGE-FORMAT
      - TECH-DOC-WRITING-STYLE
      - TECH-NAMING-CONVENTION
      - TECH-SECRET-HANDLING
      - TECH-SPEC-ID-ANNOTATIONS
  - repository_name: contracts
    description: >-
      OpenAPI contract that defines the order API and is the single source of
      truth the api implements and the frontend consumes.
    path: ../contracts
    tech-specs:
      - TECH-COMMIT-MESSAGE-FORMAT
      - TECH-DOC-WRITING-STYLE
      - TECH-NAMING-CONVENTION
      - TECH-SECRET-HANDLING
      - TECH-SPEC-ID-ANNOTATIONS
  - repository_name: frontend
    description: React + Vite web client that lets customers place pizza orders.
    path: ../frontend
    tech-specs:
      - TECH-COMMIT-MESSAGE-FORMAT
      - TECH-DOC-WRITING-STYLE
      - TECH-NAMING-CONVENTION
      - TECH-SECRET-HANDLING
      - TECH-SPEC-ID-ANNOTATIONS
  - repository_name: spex
    description: >-
      Spex workspace repository. Holds the specs and config that govern the
      project: schemas/ (JSON Schemas for spex.yml and the spec files),
      tech-specs/ (cross-cutting technical rules) and biz-specs/ (business
      rules).
    path: .
    tech-specs:
      - TECH-COMMIT-MESSAGE-FORMAT
      - TECH-DOC-WRITING-STYLE
      - TECH-NAMING-CONVENTION
      - TECH-SECRET-HANDLING
