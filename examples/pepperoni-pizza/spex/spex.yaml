project_name: pepperoni-pizza
cli_version: 0.2.0
description: >-
  Online pepperoni pizza ordering system built from a Rust API, an OpenAPI
  contract, and a React web client.
repositories:
  - repository_name: api
    description: Rust/Axum backend service that implements the pizza order API.
    path: ../api
    tech_specs:
      - TECH-COMMIT-MESSAGE-FORMAT
      - TECH-WRITING-STYLE
      - TECH-NAMING-CONVENTION
      - TECH-SECRET-HANDLING
      - TECH-SPEC-ID-ANNOTATIONS
      - TECH-NETWORK-CONFIG
  - repository_name: contracts
    description: >-
      OpenAPI contract that defines the order API and is the single source of
      truth the api implements and the frontend consumes.
    path: ../contracts
    tech_specs:
      - TECH-COMMIT-MESSAGE-FORMAT
      - TECH-WRITING-STYLE
      - TECH-NAMING-CONVENTION
      - TECH-SECRET-HANDLING
      - TECH-SPEC-ID-ANNOTATIONS
  - repository_name: frontend
    description: React + Vite web client that lets customers place pizza orders.
    path: ../frontend
    tech_specs:
      - TECH-COMMIT-MESSAGE-FORMAT
      - TECH-WRITING-STYLE
      - TECH-NAMING-CONVENTION
      - TECH-SECRET-HANDLING
      - TECH-SPEC-ID-ANNOTATIONS
    # Patch an inherited check: keep the shared spex pattern, only lower the severity.
    checks_override:
      - spec: TECH-WRITING-STYLE
        name: no-cyrillic
        severity: warn
    # Add a frontend-only check; its script lives in spex (scripts/TECH-WRITING-STYLE/).
    checks_additional:
      - spec: TECH-WRITING-STYLE
        name: readme-has-title
        description: The frontend README must start with a top-level Markdown title
        type: script
        run: per-repo
        script: readme-has-title.sh
        severity: warn
  - repository_name: spex
    description: >-
      Spex workspace repository. Holds the specs and config that govern the
      project: schemas/ (JSON Schemas for spex.yaml and the spec files),
      tech-specs/ (cross-cutting technical rules) and biz-specs/ (business
      rules).
    path: .
    tech_specs:
      - TECH-COMMIT-MESSAGE-FORMAT
      - TECH-WRITING-STYLE
      - TECH-NAMING-CONVENTION
      - TECH-SECRET-HANDLING
      - TECH-SPEX-CONFORMANCE
