id: TECH-COMMIT-MESSAGE-FORMAT
include_for_all_repos: true
readonly: true
title: Commit Message Format
description: >-
  Commits are the unit of traceability between code and the specs that justify
  it. Conventional Commit subjects that end with the affected Spec IDs let every
  behavioral change trace back to an approved requirement.
acceptance_criteria:
  - "MUST use Conventional Commits format `{type}(scope): message [Spec ID]` with comma separated affected Spec ID list in brackets at the end of the subject line"
  - "MUST include at least one Spec ID in brackets for every behavioral change commit"

checks:
  - name: commit-id-format
    description: Recent behavioral commits must end with a bracketed, comma-separated Spec ID list
    type: script
    run: per-repo
    script: commit-id-format.sh
    severity: warn
