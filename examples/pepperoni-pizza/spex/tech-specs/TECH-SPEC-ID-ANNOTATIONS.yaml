id: TECH-SPEC-ID-ANNOTATIONS
include_for_all_repos: true
include_for_spex: false
readonly: true
title: Spec ID annotation format
description: >-
  Annotations link a contract, implementation, or test back to the spec it
  satisfies. Placing them once at each layer boundary keeps traceability
  unambiguous without scattering Spec IDs through internal helpers.
acceptance_criteria:
  - "MUST annotate contract, implementation and test at least once at the boundary"
  - "MUST annotate as `x-spec: <spec-id>` e.g. `x-spec: BIZ-LIST-PIZZA-MENU` property in an OpenAPI schema, otherwise as a comment `@spec {contract|impl|test} {SpecID}[, {SpecID}]*` e.g. `@spec impl BIZ-LIST-PIZZA-MENU`"
  - "SHOULD NOT do nested annotations, e.g. handler->service->repository"
examples:
  contract: |
    # OpenAPI operation — annotate the boundary, not every nested schema
    paths:
      /pizzas:
        get:
          operationId: listPizzaMenu
          x-spec: BIZ-LIST-PIZZA-MENU
  implementation: |
    // @spec impl BIZ-LIST-PIZZA-MENU
    fn list_pizza_menu(req: Request) -> Response {
        // menu_service and its repository are NOT annotated (no nesting)
        menu_service.list()
    }
  test: |
    // @spec test BIZ-LIST-PIZZA-MENU, BIZ-ORDER-PIZZA
    fn lists_available_pizzas() { /* ... */ }
