openapi: 3.1.0
info:
  title: Pepperoni Pizza API
  version: 1.0.0
  description: Minimal pepperoni pizza order API used as a spex example.
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /pizzas:
    get:
      operationId: listPizzas
      summary: List the pizza menu
      x-spec: "@spec contract BIZ-LIST-PIZZA-MENU"
      responses:
        "200":
          description: The pizza menu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pizza"
  /orders:
    get:
      operationId: listOrders
      summary: List all orders
      responses:
        "200":
          description: The list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: The created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: getOrder
      summary: Get an order by id
      responses:
        "200":
          description: The requested order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateOrder
      summary: Update an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrder"
      responses:
        "200":
          description: The updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteOrder
      summary: Delete an order
      responses:
        "204":
          description: Order deleted
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: Unique identifier of the order
      schema:
        type: integer
        format: int64
  schemas:
    Pizza:
      type: object
      required:
        - id
        - name
        - description
        - price
      properties:
        id:
          type: string
          readOnly: true
          description: Stable menu key for the pizza
          examples:
            - margherita
        name:
          type: string
          minLength: 1
          examples:
            - Margherita
        description:
          type: string
          examples:
            - Tomato, mozzarella, basil
        price:
          type: number
          minimum: 0
          description: Price in the storefront currency
          examples:
            - 9.5
    Order:
      type: object
      required:
        - id
        - customer
        - delivered
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          examples:
            - 1
        customer:
          type: string
          minLength: 1
          examples:
            - Mario
        delivered:
          type: boolean
          examples:
            - false
    NewOrder:
      type: object
      required:
        - customer
      properties:
        customer:
          type: string
          minLength: 1
          examples:
            - Mario
        delivered:
          type: boolean
          default: false
    UpdateOrder:
      type: object
      properties:
        customer:
          type: string
          minLength: 1
        delivered:
          type: boolean
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          examples:
            - Order not found
