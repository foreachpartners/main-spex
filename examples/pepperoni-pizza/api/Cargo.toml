# Standalone workspace so this example is not pulled into the spex crate.
[workspace]

[package]
name = "pepperoni-pizza-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
config = { version = "0.14", default-features = false }
dotenvy = "0.15"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.7.0", features = ["cors"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
