openapi: 3.1.0
info:
  title: Pepperoni Pizza API
  version: 1.0.0
  description: Minimal pepperoni pizza shop API used as a spex example.
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /pizzas:
    get:
      operationId: listPizzas
      summary: List the pizza menu
      responses:
        "200":
          description: The pizzas available to order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pizza"
  /orders:
    post:
      operationId: createOrder
      summary: Order the pizzas in a cart and start a delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: The delivery that was started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /deliveries:
    get:
      operationId: listDeliveries
      summary: List the deliveries currently in progress
      description: A delivery is removed automatically once its estimated delivery time elapses, so clients poll this endpoint to keep their delivering view up to date.
      responses:
        "200":
          description: The deliveries still in progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
  /order-estimate:
    post:
      operationId: estimateOrderDeliveryTime
      summary: Estimate the delivery time for a set of pizzas before the order is placed
      description: Returns a live delivery-time estimate for the pizzas currently in the cart so the frontend can show it as the customer adds pizzas. The estimate accounts for the pizzas in the request plus the pizzas across all in-progress deliveries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
      responses:
        "200":
          description: The estimated delivery time for the given pizzas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryEstimate"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-spec: BIZ-DELIVERY-TIME
components:
  schemas:
    Pizza:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 1
        name:
          type: string
          examples:
            - Margherita
        price:
          type: number
          format: double
          examples:
            - 8.5
      required:
        - id
        - name
        - price
    NewOrder:
      type: object
      properties:
        pizzaIds:
          type: array
          items:
            type: integer
            format: int64
          examples:
            - - 1
              - 2
          minItems: 1
      required:
        - pizzaIds
    Delivery:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 1
        items:
          type: array
          items:
            type: string
          examples:
            - - Margherita
              - Pepperoni
        estimatedSeconds:
          description: Estimated whole seconds until this delivery arrives, computed in whole minutes (1 minute per pizza, rounded up) and returned in seconds. Fixed at order creation.
          type: integer
          format: int64
          examples:
            - 120
        remainingSeconds:
          description: Whole seconds left until this delivery arrives, counting down from estimatedSeconds as time passes. Recomputed on each request.
          type: integer
          format: int64
          examples:
            - 90
      required:
        - id
        - items
        - estimatedSeconds
        - remainingSeconds
    EstimateRequest:
      type: object
      properties:
        pizzaIds:
          type: array
          items:
            type: integer
            format: int64
          examples:
            - - 1
              - 2
      required:
        - pizzaIds
    DeliveryEstimate:
      type: object
      properties:
        estimatedSeconds:
          description: Estimated whole seconds until delivery for the requested pizzas, computed in whole minutes (1 minute per pizza, rounded up) and returned in seconds.
          type: integer
          format: int64
          examples:
            - 120
      required:
        - estimatedSeconds
    Error:
      type: object
      properties:
        message:
          type: string
          examples:
            - order must contain at least one pizza
      required:
        - message
