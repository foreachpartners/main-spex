id: register-user-api
title: Let customers register a new account
description: >-
  Lets a new customer create an account with an email, password, and nickname.
  Accounts are held in memory for this example project, with no persistent database.
acceptance_criteria:
  - id: create-account-from-fields
    must: "create a new account given an email, a password, and a nickname"
    is_done: false
  - id: valid-email-required
    must: "require the email to be a syntactically valid email address"
    is_done: false
  - id: reject-duplicate-email
    must: "reject registration when the email is already registered to an existing account"
    is_done: false
  - id: password-length-required
    must: "require the password to be between 8 and 32 characters"
    is_done: false
  - id: nickname-length-required
    must: "require the nickname to be between 1 and 60 characters"
    is_done: false
  - id: in-memory-account-store
    must: "store registered accounts in memory, with no persistent database"
    is_done: false
  - id: nicknames-not-unique
    must_not: "require nicknames to be unique across accounts"
    is_done: false
  - id: no-email-confirmation
    must_not: "require email confirmation before the account is usable"
    is_done: false
  - id: no-plaintext-password
    must_not: "store the account's password as plaintext"
    is_done: false
  - id: no-account-persistence
    must_not: "persist registered accounts across process restarts, given the in-memory storage"
    is_done: false
scope:
  - api
status: planned
contract: single
