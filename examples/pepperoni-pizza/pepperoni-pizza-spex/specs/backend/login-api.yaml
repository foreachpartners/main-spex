id: login-api
title: Let customers log in with email and password
description: >-
  Lets a registered customer authenticate with their email and password and
  receive a session bearer token to use on subsequent requests. Sessions are
  held in memory for this example project, with no persistent database.
acceptance_criteria:
  - id: authenticate-matching-credentials
    must: "authenticate the customer given a registered email and its matching password"
    is_done: false
  - id: session-token-on-success
    must: "return a session bearer token on successful authentication"
    is_done: false
  - id: generic-error-on-mismatch
    must: "reject login with a generic error when the email is unknown or the password does not match, without revealing which one failed"
    is_done: false
  - id: in-memory-session-store
    must: "store active sessions in memory, with no persistent database"
    is_done: false
  - id: no-session-expiry
    must_not: "expire the session bearer token"
    is_done: false
  - id: no-session-persistence
    must_not: "persist active sessions across process restarts, given the in-memory storage"
    is_done: false
scope:
  - api
blocked_by:
  - register-user-api
status: planned
contract: single
