project_name: pepperoni-pizza
description: >-
  Online pizza ordering for a pizzeria, with menu browsing, cart checkout, and
  live delivery tracking.
cli_version: 0.7.41
repositories:
  - repository_name: pepperoni-pizza-api
    repository_short_name: api
    description: >-
      Rust/axum backend that serves the pizza menu, accepts orders, and tracks
      in-progress deliveries.
    path: ../pepperoni-pizza-api
    contracts:
      - path: contracts/api.openapi.yaml
        description: >-
          REST OpenAPI spec for the pizza menu, orders, and deliveries
          endpoints.
    rs_specs:
      - RS-COMMIT-MESSAGE-FORMAT
      - RS-CONFIGURABLE-NETWORK-BIND
      - RS-DEPENDENCIES
      - RS-NAMING-CONVENTION
      - RS-SECRET-HANDLING
      - RS-SPEC-ID-TRACING
      - RS-WRITING-STYLE
      - RS-TESTING
  - repository_name: pepperoni-pizza-frontend
    repository_short_name: frontend
    description: >-
      React + TypeScript (Vite) web client where customers browse pizzas, place
      orders, and watch deliveries.
    path: ../pepperoni-pizza-frontend
    rs_specs:
      - RS-COMMIT-MESSAGE-FORMAT
      - RS-DEPENDENCIES
      - RS-NAMING-CONVENTION
      - RS-SECRET-HANDLING
      - RS-SPEC-ID-TRACING
      - RS-WRITING-STYLE
      - RS-TESTING
  - repository_name: pepperoni-pizza-spex
    repository_short_name: spex
    description: >-
      Spex workspace repository. Holds the specs and config that govern the
      project: schemas/ (JSON Schemas for spex.yaml and the spec files),
      rs-specs/ (cross-cutting conventions and rules) and fs-specs/ (the
      capabilities the system provides).
    path: .
    rs_specs:
      - RS-COMMIT-MESSAGE-FORMAT
      - RS-DEPENDENCIES
      - RS-NAMING-CONVENTION
      - RS-SECRET-HANDLING
      - RS-SPEX-CONFORMANCE
      - RS-WRITING-STYLE
