id: RS-SPEC-ID-TRACING
include_for_all_repos: true
include_for_spex: false
managed: true
title: Spec ID annotation format
description: >-
  Annotations link a contract, implementation, or test back to the spec it
  satisfies. Placing them once at each layer boundary keeps traceability
  unambiguous without scattering Spec IDs through internal helpers.
acceptance_criteria:
  - "MUST annotate capability (CS) spec contract, implementation and test at least once at the boundary"
  - "MUST annotate as the OpenAPI property `x-spec: <spec-id>` (e.g. `x-spec: CS-LIST-PIZZA-MENU`), otherwise as a comment `@spec contract|impl|test <spec-id>[, <spec-id>]...` (e.g. `@spec impl CS-LIST-PIZZA-MENU`)"
  - "MUST NOT reference a Spec ID that has no matching spec file (no orphan annotations)"
  - "SHOULD NOT do nested annotations, e.g. handler->service->repository"
  - "MAY annotate rule (RS) spec following same rules"
checks:
  - name: annotation-format
    description: Spec-id annotations must use the documented comment or x-spec syntax
    type: script
    run: per-file
    script: annotation-format.sh
    exclude:
      - "**/*.md"
    severity: warn
  - name: no-orphan-annotations
    description: Spec-id annotations must reference a spec that exists in cs-specs or rs-specs
    type: script
    run: workspace
    script: no-orphan-annotations.sh
    severity: warn
examples:
  contract: |
    # OpenAPI operation — annotate the boundary, not every nested schema
    paths:
      /pizzas:
        get:
          operationId: listPizzaMenu
          x-spec: CS-LIST-PIZZA-MENU
  implementation: |
    // @spec impl CS-LIST-PIZZA-MENU
    fn list_pizza_menu(req: Request) -> Response {
        // menu_service and its repository are NOT annotated (no nesting)
        menu_service.list()
    }
  rule: |
    // Rule (RS) specs follow the same rules — optional, at the boundary, no nesting
    // @spec impl RS-RATE-LIMIT
    fn rate_limit(req: Request) -> Response { /* ... */ }
  test: |
    // @spec test CS-LIST-PIZZA-MENU, CS-ORDER-PIZZA, RS-RATE-LIMIT
    fn lists_available_pizzas() { /* ... */ }
