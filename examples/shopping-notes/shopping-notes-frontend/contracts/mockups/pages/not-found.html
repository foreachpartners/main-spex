<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Not found page mockup</title>
        <script src="../mockup.js"></script>
    </head>
    <body>
        <main>
            <div data-state="default">
                <p class="mockup__title">Default</p>
                <div class="not-found">
                    <p class="not-found__code">404</p>
                    <p class="not-found__title">Page not found</p>
                    <p class="not-found__description">
                        The page you're looking for doesn't exist or has moved.
                    </p>
                    <a class="not-found__link" href="/">Back to main page</a>
                </div>
            </div>
        </main>
    </body>
</html>
