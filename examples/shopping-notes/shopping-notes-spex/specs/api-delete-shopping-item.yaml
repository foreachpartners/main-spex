id: api-delete-shopping-item
title: Delete a shopping item
description: >-
  Lets a client remove a single item from the shopping list, e.g. when the
  user no longer needs it.
acceptance_criteria:
  - id: delete-item-by-id
    must: 'remove the item from the JSON file store when `DELETE /items/{id}` is called with an existing item id'
  - id: persist-deletion
    must: persist the deletion so the item does not reappear after an API restart
  - id: unknown-item-not-found
    must: 'return a 404 response from `DELETE /items/{id}` when no item matches `id`'
scope:
  - api
status: active
contract: single
