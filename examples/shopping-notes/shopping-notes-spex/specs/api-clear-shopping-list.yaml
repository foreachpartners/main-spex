id: api-clear-shopping-list
title: Clear the shopping list
description: >-
  Lets a client remove every item from the shopping list in one call, e.g.
  after a shopping trip is done.
acceptance_criteria:
  - id: delete-all-items
    must: 'delete every item from the JSON file store when `DELETE /items` is called'
  - id: persist-cleared-list
    must: persist the empty list so cleared items do not reappear after an API restart
scope:
  - api
status: active
contract: single
