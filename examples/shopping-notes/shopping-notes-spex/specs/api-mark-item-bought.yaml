id: api-mark-item-bought
title: Mark a shopping item as bought
description: >-
  Lets a client update a shopping item's bought status so the user can track
  what they've already picked up.
acceptance_criteria:
  - id: update-bought-status
    must: 'set the item''s `bought` field to the given value when `PATCH /items/{id}` is called with a `bought` boolean'
  - id: persist-bought-status
    must: persist the updated `bought` status to the JSON file store so it survives an API restart
  - id: unknown-item-not-found
    must: "return a 404 response from `PATCH /items/{id}` when no item matches `id`"
packages:
  - api
status: active
contract: single
