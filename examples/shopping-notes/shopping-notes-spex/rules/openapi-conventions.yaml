id: openapi-conventions
title: OpenAPI conventions
sync_with_upstream: true
description: >-
  The OpenAPI document is the contract that clients and servers must follow.
acceptance_criteria:
  - "MUST use OpenAPI 3.1.1"
  - "MUST declare every endpoint with operationId, summary, and at least one response"
  - "MUST give every operationId a unique value across the document"
  - "MUST annotate each operation with its spec via the `x-spec` extension (e.g. `x-spec: @spec contract list-pizza-menu`)"
  - "MUST define request and response shapes in components/schemas; never inline"
  - "MUST give every schema a name and use $ref to reference it"
  - "MUST list explicit error responses (4xx, 5xx) for non-trivial endpoints"
  - "MUST name every components/securitySchemes key with `^[a-zA-Z0-9._-]+$`"
  - "MUST mark every secret-bearing field (password, token, key, credential) with `x-sensitive: true` so generated code can wrap it in a secret type"
  - "MUST set `format: password` on secret string fields and `writeOnly: true` on secrets accepted in requests but never returned in responses (e.g. password)"
  - "MUST use snake_case as the default casing for property names, query parameter names, and enum values. URL path segments use kebab-case"
  - "MUST NOT use anyOf / oneOf without a discriminator"
  - "MUST NOT leave operationId implicit"
  - "MUST NOT duplicate spec mappings between the `x-spec` annotation and `info.description` — the `x-spec` annotation is the single source of truth"
  - "MUST NOT leak internal implementation or persistence details in descriptions (storage, hashing, encryption, normalization, backing datastore); describe only what a consumer observes and must satisfy (e.g. `8–128 characters`, not `stored as an Argon2 hash`)"
  - "SHOULD use enum constraints for fields with a closed set of values"
  - "SHOULD declare path parameters with explicit type and format (uuid, date-time, etc.)"
checks:
  - name: vacuum-lint
    description: Lint OpenAPI documents with vacuum against the MUST and MUST NOT criteria; errors when vacuum is not installed
    type: script
    run: per-file
    script: vacuum-lint.sh
    include:
      - "**/*.openapi.{yaml,yml,json}"
      - "**/openapi.{yaml,yml,json}"
    severity: error
examples:
  operation: |
    paths:
      /pizzas:
        get:
          operationId: listPizzaMenu
          summary: List the available pizza menu
          x-spec: "@spec contract list-pizza-menu"
          responses:
            "200":
              description: Menu returned
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/PizzaMenu"
            "500":
              $ref: "#/components/responses/InternalError"
  schema: |
    components:
      schemas:
        PizzaMenu:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Pizza"
