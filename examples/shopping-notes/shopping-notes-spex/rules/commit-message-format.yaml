id: commit-message-format
title: Commit message format
sync_with_upstream: true
description: >-
  Commits are the unit of traceability between code and the specs that justify
  it. Scope names the affected area freely; the `@spec` tag and its attached ID
  list is what lets every spec-related change trace back to an approved
  requirement. See https://www.conventionalcommits.org/ for the
  Conventional Commits specification.
acceptance_criteria:
  - "MUST use Conventional Commits format `<type>[optional scope]: <description>` with an optional body separated by a blank line"
  - "MUST tag spec-related commits with `@spec <Spec ID>[#<AC ID>][, <Spec ID>[#<AC ID>]]` in the subject or body"
  - "MUST tag each checked feat commit and each checked fix commit that adds an annotation"
  - "MUST use exact or spec-level tags covering each annotation added by a checked feat or fix commit"
  - "MUST resolve each checked tag in the current spec catalog, unless a matching annotation was added by that commit and later removed"
checks:
  - name: commit-conventional-format
    description: Recent commits must follow the Conventional Commits subject format
    type: script
    run: per-package
    script: commit-conventional-format.sh
    severity: warn
  - name: commit-spec-id-trace
    description: >-
      Verify spec IDs and added annotations in feat and fix commits among the
      last three non-merge commits, or among non-merge commits after the
      ancestor revision in SPEX_COMMIT_BASE. Compare additions where parent
      history is available.
    type: script
    run: per-package
    script: commit-spec-id-trace.sh
    severity: warn
examples:
  subject: |
    style: format md files
    feat(ui): list available pizzas @spec list-pizza-menu
    fix(cart): reject negative quantities @spec cart-add-item, cart-validate
  spec_ids_in_description: |
    feat(ui): list available pizzas @spec list-pizza-menu

    Render the menu from the catalog service and cache results for 60s
    to reduce load on the upstream API.
  spec_ids_in_body: |
    fix(cart): handle empty catalog response

    The catalog service sometimes returns 200 with an empty body
    when no items match the query. Return an empty list instead
    of panicking.

    @spec list-pizza-menu, catalog-cache
