id: testing-rules
title: Testing hygiene
description: >-
  A test suite is only trustworthy if every test in it runs and can fail. Skipping,
  ignoring, or focusing a test silences its pass/fail signal covertly — the suite
  still goes green while coverage quietly narrows.
acceptance_criteria:
  - "MUST fix a failing test at its root cause rather than loosening its assertions"
  - "MUST NOT commit a skipped, ignored, or pending test"
  - "MUST NOT commit a focused test (`.only`, `fit`, `fdescribe`) that excludes its siblings from running"
checks:
  - name: no-skipped-tests
    description: Flag skipped, ignored, or pending tests (non-JS/TS runners)
    type: regexp
    pattern: '#\[ignore\]|@pytest\.mark\.skip|@unittest\.skip|t\.Skip\('
    include:
      - "**/*_test.*"
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/tests/**"
      - "**/test/**"
    severity: warn
  - name: no-skipped-tests-js
    description: >-
      Flag `xit`/`xdescribe`, or a `describe`/`it`/`test`/`context.skip(...)`
      call. Scoped to those four runner objects — unlike a plain `\.skip\(`
      regex — so it does not flag an unrelated `.skip(...)` call (e.g. a
      Rust-style iterator skip) that merely appears in a test file.
    type: ast-grep
    language: typescript
    rule:
      rule:
        any:
          - pattern: xit($$$ARGS)
          - pattern: xdescribe($$$ARGS)
          - pattern: $OBJ.skip($$$ARGS)
      constraints:
        OBJ:
          regex: "^(describe|it|test|context)$"
    include:
      - "**/*_test.{ts,tsx,js,jsx}"
      - "**/*.{test,spec}.{ts,tsx,js,jsx}"
      - "**/{tests,test}/**/*.{ts,tsx,js,jsx}"
    severity: warn
  - name: no-focused-tests-js
    description: >-
      Flag focused tests (`fit`, `fdescribe`, or `describe`/`it`/`test`/`context.only(...)`)
      that exclude their siblings from running. Constraining `.only` to those
      four runner objects avoids flagging an unrelated `.only(...)` call that
      merely appears in a test file. Fully covers the acceptance criterion —
      `.only`/`fit`/`fdescribe` are JS/TS test-runner concepts with no Rust,
      Python, or Go equivalent, so no regexp fallback is needed here.
    type: ast-grep
    language: typescript
    rule:
      rule:
        any:
          - pattern: fit($$$ARGS)
          - pattern: fdescribe($$$ARGS)
          - pattern: $OBJ.only($$$ARGS)
      constraints:
        OBJ:
          regex: "^(describe|it|test|context)$"
    include:
      - "**/*_test.{ts,tsx,js,jsx}"
      - "**/*.{test,spec}.{ts,tsx,js,jsx}"
      - "**/{tests,test}/**/*.{ts,tsx,js,jsx}"
    severity: error
