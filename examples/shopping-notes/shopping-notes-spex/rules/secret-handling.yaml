id: secret-handling
title: Secret protection
description: >-
  Hardcoded credentials, tokens, and keys are a common source of breaches, and
  secrets leaked through logs or error messages are just as damaging. Secrets
  must be loaded from the environment or a secret store and masked everywhere
  they could surface.
acceptance_criteria:
  - "MUST mask any field carrying a secret (key, token, password, credential) when implementing Debug, Display, or any other logging"
  - "MUST NOT log secrets (encryption keys, API keys, tokens, DB credentials) via `info!`, `console.log`, or any other logging"
  - "MUST NOT include secrets in error messages or error variants"
  - "MUST NOT hardcode secrets in source — load from env at startup or from a secret store"
  - "MUST NOT commit backup/scratch files (*.bak, *.backup, *.orig) that may carry pre-redaction content"
checks:
  - name: no-backup-files
    description: Backup and scratch files may carry pre-redaction content
    type: glob
    pattern: "**/*.{bak,backup,orig}"
    severity: warn
  - name: no-secret-in-console-log
    description: A console.* call must not log an argument named like a secret
    type: ast-grep
    language: typescript
    rule:
      rule:
        all:
          - pattern: console.$METHOD($$$ARGS)
          - has:
              stopBy: end
              regex: "(?i)(token|secret|password|credential|api[_-]?key)"
    include:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
    severity: error
  - name: no-secret-in-rust-log-macro
    description: A log/tracing macro call must not log an argument named like a secret
    type: ast-grep
    language: rust
    rule:
      rule:
        all:
          - any:
              - pattern: info!($$$ARGS)
              - pattern: warn!($$$ARGS)
              - pattern: error!($$$ARGS)
              - pattern: debug!($$$ARGS)
              - pattern: trace!($$$ARGS)
          - has:
              stopBy: end
              regex: "(?i)(token|secret|password|credential|api[_-]?key)"
    include:
      - "**/*.rs"
    severity: error
examples:
  avoid: |
    #[derive(Debug)] // leaks the token wherever the struct is logged
    struct Client {
        api_token: String,
    }
  prefer: |
    struct Client {
        api_token: Secret<String>,
    }

    impl fmt::Debug for Client {
        fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
            f.debug_struct("Client").field("api_token", &"***").finish()
        }
    }
