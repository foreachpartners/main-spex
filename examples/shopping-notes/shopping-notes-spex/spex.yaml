project_name: shopping-notes
cli_version: 0.10.2
description: >-
  Web application for managing shopping lists, letting users note items to
  buy so they don't forget them at the store.
rules_unused:
  - graphql-conventions
repositories:
  - repository_name: shopping-notes-api
    repository_short_name: api
    description: Fastify REST API backend for the shopping notes application.
    path: ../shopping-notes-api
    contracts:
      - path: contracts/api.openapi.yaml
        description: OpenAPI contract for the shopping notes API.
    rules:
      - commit-message-format
      - dependencies-rules
      - naming-convention
      - openapi-conventions
      - secret-handling
      - testing-rules
      - writing-style
  - repository_name: shopping-notes-frontend
    repository_short_name: frontend
    description: React SPA that lets users create and manage shopping notes against the API.
    path: ../shopping-notes-frontend
    contracts:
      - path: ../shopping-notes-frontend/contracts/figma.md
        description: Figma design references for frontend UI specs.
    rules:
      - commit-message-format
      - dependencies-rules
      - naming-convention
      - secret-handling
      - testing-rules
      - writing-style
  - repository_name: shopping-notes-spex
    repository_short_name: spex
    description: >-
      Spex workspace repository. Holds the specs and config that govern the
      project: schemas/ (JSON Schemas for spex.yaml and the spec files),
      rules/ (cross-cutting conventions and rules), specs/ (the
      functionality the system provides) and docs/ (framework reference).
    path: .
    rules:
      - commit-message-format
      - naming-convention
      - secret-handling
      - writing-style
