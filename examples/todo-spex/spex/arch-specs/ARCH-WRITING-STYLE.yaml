id: ARCH-WRITING-STYLE
include_on_spex_init: true
title: LLM-Oriented Writing Style
description: >-
  Specs and documentation are read by both engineers and AI agents. Direct,
  imperative prose with explicit commitment levels and no filler keeps rules
  unambiguous and machine-actionable.
acceptance_criteria:
  - "MUST use imperative, directive language: 'Load ENV at startup.' not 'First, we''ll load ENV...'"
  - "MUST prioritize clarity over brevity; brevity over all else"
  - "MUST use MUST for mandatory rules, SHOULD for recommended, MAY for optional, DO NOT for prohibited"
  - "MUST fix all findings from the llm-writing check before publishing"
  - "MUST NOT use motivational phrases: 'Great job!', 'Perfect!', 'Excellent!'"
  - "MUST NOT use uncertainty markers: 'maybe', 'perhaps', 'I think'"
  - "MUST NOT use filler words: 'basically', 'essentially', 'actually'"
  - "MUST NOT use apologies: 'sorry', 'unfortunately'"
  - "MUST NOT use conversational check-ins: 'Make sense?', 'Got it?'"
  - "MUST NOT use subjective qualifiers: 'elegant', 'beautiful', 'clean'"
  - "MUST NOT use non-English text in rules and documentation"

checks:
  - name: llm-writing
    description: Flag filler, hedging, motivational, and apologetic phrasing in docs
    type: script
    include:
      - "**/*.md"
    severity: warn

  - name: no-cyrillic
    description: Requirements and documentation must be in English
    type: regexp
    pattern: '\p{Cyrillic}'
    include:
      - "func-specs/*.yaml"
      - "**/*.md"
    severity: error
