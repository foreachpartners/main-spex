id: ARCH-SECRETS
title: Secret Protection
description: >-
  Hardcoded credentials, tokens, and keys are a common source of breaches, and
  secrets leaked through logs or error messages are just as damaging. Secrets
  must be loaded from the environment or a secret store and masked everywhere
  they could surface.
acceptance_criteria:
  - "MUST mask any field carrying a secret (key, token, password, credential) when implementing Debug, Display, or any other logging"
  - "MUST NOT log secrets (encryption keys, API keys, tokens, DB credentials) via `info!`, `console.log`, or any other logging"
  - "MUST NOT include secrets in error messages or error variants"
  - "MUST NOT hardcode secrets in source — load from env at startup or from a secret store"
  - "MUST NOT commit backup/scratch files (*.bak, *.backup, *.orig) that may carry pre-redaction content"

checks:
  - name: hardcoded-secrets
    description: Detect potential hardcoded secrets in source
    type: regexp
    pattern: '(password|secret|token|api_key)\s*[:=]\s*"[^"]{8,}"'
    severity: error

  - name: no-log-config-debug
    description: Config structs logged with Debug format may expose secrets
    type: regexp
    pattern: '(info!|debug!|warn!|error!|trace!)\(.*config.*:?\?'
    severity: warn

  - name: no-backup-files
    description: Backup and scratch files may carry pre-redaction content
    type: glob
    pattern: "**/*.{bak,backup,orig}"
    severity: warn
