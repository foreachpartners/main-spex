id: postgres-conventions
title: Postgres conventions
description: >-
  Naming, identifier, column-type and indexing conventions for the Postgres schema, so tables,
  keys, ids and timestamps read the same way in every bounded context.
acceptance_criteria:
  - "MUST name a table with the singular snake_case noun of the entity it stores (`book`, not `books`) and `book_genre` for relations representing one row, so the table name matches its key `book_id` and needs no irregular plurals"
  - "MUST name a primary key column `<entity>_id` (`book_id`), and a foreign key column after the key it references to avoid accidental usage of another entity `id`"
  - "MUST use UUID v7 for sortable keys, so inserts append to the end of the key index instead of scattering across it like random v4"
  - "MUST store every point in time as a timestamp with time zone (`timestamptz`, never a bare `timestamp` or a string), and name it `<verb>_at` (`created_at`, `deleted_at`), so an instant is unambiguous across sessions and daylight saving changes"
  - "MUST index every foreign key column (a foreign key creates no index in Postgres), so joins and the child-row lookup on every parent delete don't scan the whole child table"
  - "MUST store money as `numeric` with explicit precision and scale (`numeric(19, 4)`), never `float`, `double precision`, `real` or `money`, so amounts stay exact (binary floats cannot represent `0.1`) and do not depend on the server's `lc_monetary` locale"
  - "MUST use `text` for character data, never `varchar(n)` or `char(n)`, since Postgres stores them identically, tightening a `varchar(n)` limit rewrites the table under an exclusive lock, and `char(n)` pads values with spaces; enforce a real limit with a `CHECK` (`length(title) <= 200`)"
  - "MUST declare `ON DELETE` on every foreign key: `RESTRICT` by default, `CASCADE` only when the child row has no meaning without its parent (`book_genre` of a `book`), so a delete never silently removes unrelated data and the choice is visible in review"
  - "MUST declare every column `NOT NULL` unless \"not set yet\" or \"not applicable\" is a real state of the entity (`deleted_at`), never as a stand-in for an empty value, so a missing value is always a modeled state and queries do not silently skip rows through `NULL` comparisons"
examples:
  avoid: |
    CREATE TABLE books (
        id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        title varchar(255),
        created timestamp NOT NULL,
        price float8 NOT NULL
    );

    CREATE TABLE book_genre (
        book_genre_id uuid PRIMARY KEY,
        book uuid NOT NULL REFERENCES books (id)
    );
  prefer: |
    CREATE TABLE book (
        book_id uuid PRIMARY KEY,
        title text NOT NULL CHECK (length(title) <= 200),
        created_at timestamptz NOT NULL,
        price numeric(19, 4) NOT NULL,
        deleted_at timestamptz
    );

    CREATE TABLE book_genre (
        book_genre_id uuid PRIMARY KEY,
        book_id uuid NOT NULL REFERENCES book (book_id) ON DELETE CASCADE
    );

    CREATE INDEX book_genre_book_id_idx ON book_genre (book_id);

    -- $1 is generated by the app with Uuid::now_v7()
    INSERT INTO book (book_id, title, created_at, price) VALUES ($1, 'Dune', now(), 19.99);
