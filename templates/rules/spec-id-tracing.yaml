id: spec-id-tracing
title: Spec ID tracing
sync_with_upstream: true
description: >-
  Spec ID tracing annotations link a contract, implementation and test back to the spec it satisfies. It makes easy for human and AI to trace specification and related artifacts.
acceptance_criteria:
  - "MUST annotate capability spec contract, implementation and test at least once at the boundary, with additional annotations on other important artifacts being optional"
  - "MUST annotate as the OpenAPI property `x-spec: <spec-id>` (e.g. `x-spec: list-pizza-menu`), otherwise as a comment `@spec contract|impl|test <spec-id>[#<ac-id>][, <spec-id>[#<ac-id>]]...` (e.g. `@spec impl list-pizza-menu`)"
  - "MUST tag a spec's impl and test annotations with the `#<ac-id>` of the acceptance criterion they satisfy (e.g. `@spec impl list-pizza-menu#in-stock-only`), since `spex coverage` only counts a bare, unqualified annotation toward a target with no acceptance-criteria ids (e.g. a rule)"
  - "MUST NOT reference a Spec ID that has no matching spec file (no orphan annotations)"
  - "SHOULD NOT do nested annotations, e.g. handler->service->repository"
  - "MAY annotate a rule following same rules, using a bare `@spec impl|test <rule-id>` since rules have no acceptance-criterion ids"
checks:
  - name: annotation-format
    description: Spec-id annotations must use the documented comment or x-spec syntax
    type: script
    run: per-file
    script: annotation-format.sh
    exclude:
      - "**/*.md"
    severity: warn
  - name: no-orphan-annotations
    description: Spec-id annotations must reference a spec that exists in specs or rules
    type: script
    run: workspace
    script: no-orphan-annotations.sh
    severity: warn
examples:
  contract: |
    # OpenAPI operation — annotate the boundary, not every nested schema
    paths:
      /pizzas:
        get:
          operationId: listPizzaMenu
          x-spec: list-pizza-menu
  implementation: |
    // @spec impl list-pizza-menu#in-stock-only
    fn list_pizza_menu(req: Request) -> Response {
        // menu_service and its repository are NOT annotated (no nesting)
        menu_service.list()
    }
  rule: |
    // Rules follow the same rules — optional, at the boundary, no nesting,
    // and bare since rules have no acceptance-criterion ids.
    // @spec impl rate-limit
    fn rate_limit(req: Request) -> Response { /* ... */ }
  test: |
    // @spec test list-pizza-menu#in-stock-only, order-pizza#requires-items, rate-limit
    fn lists_available_pizzas() { /* ... */ }
