id: password-policy
title: Validate, normalize and hash passwords
description: Accepts any password a user can type and stores it so a leaked database does not reveal it, for every password the system verifies. Loosely follows NIST SP 800-63B and the OWASP Password Storage Cheat Sheet.
acceptance_criteria:
  - id: normalized
    must: "normalize `password` to NFKC as the first step, before validating, hashing or checking it against a hash, at creation and at login, so every later check works on the normalized value and the same password typed composed or decomposed on different devices hashes to the same value"
  - id: length-limits
    must: "require `password` to be 8 to 128 Unicode scalar values long when a user sets or changes it"
  - id: any-character
    must: "allow every Unicode character in `password` other than control characters, in any language or script, spaces and emoji inside it included, because the `password` is only hashed and never shown"
  - id: control-characters-rejected
    must: "reject a `password` containing a control character (Unicode category `Cc`, tab and newline included) when a user sets or changes it, because it cannot be typed in a form field and a NUL can truncate the password in native hashing code"
  - id: untrimmed-rejected
    must: "reject a `password` with leading or trailing whitespace (the Unicode `White_Space` property) when a user sets or changes it, instead of trimming it, because a stray space typed or autocompleted at creation is most likely a user mistake that would lock the user out at the next login, and trimming would silently change the secret"
  - id: common-rejected
    must: "reject a `password` found in a list of common or breached passwords when a user sets or changes it, because attackers try those first, whatever their length"
  - id: hashed-with-argon2id
    must: "store the `password` only as an Argon2id hash with a unique random salt, never as plaintext or in a reversible form, so a leaked database does not reveal the passwords"
  - id: argon2id-parameters
    must: "hash the `password` with Argon2id using at least 19 MiB of memory, 2 iterations and 1 degree of parallelism, the OWASP minimum (roughly 25 ms per hash on a recent PC), so guessing a stolen hash stays expensive"
  - id: no-composition-rules
    must_not: "require `password` to contain a digit, an uppercase letter or a symbol, because composition rules push users to predictable substitutions"
  - id: no-periodic-change
    should_not: "force users to change a `password` they chose on a schedule, because scheduled changes push users to predictable variations of the old one and add no protection unless the password is compromised"
