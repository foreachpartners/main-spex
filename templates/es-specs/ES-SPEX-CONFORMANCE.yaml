id: ES-SPEX-CONFORMANCE
include_for_all_repos: false
include_for_spex: true
managed: true
title: Spec files stay schema-valid
description: >-
  The spex repository is the single source of truth for the project's specs:
  the workspace config in spex.yaml, the capability specs in cs-specs/, and the
  engineering specs in es-specs/. When a spec file drifts from its schema, is
  misnamed, or points a check at a script that is not there, every tool and
  agent that reads the spec breaks. Validating the files on every change keeps
  the source dependable.
acceptance_criteria:
  - "MUST validate spex.yaml against schemas/spex.schema.json"
  - "MUST validate every cs-specs/<spec-id>.yaml against schemas/cs-spec.schema.json"
  - "MUST validate every es-specs/<spec-id>.yaml against schemas/es-spec.schema.json"
  - "MUST name each spec file <spec-id>.yaml, so the filename stem equals the file's id"
  - "MUST ship every script a es-spec check references at scripts/<spec-id>/<script>"
  - "MUST order every spec's acceptance criteria by RFC 2119 commitment level: MUST, MUST NOT, SHOULD, SHOULD NOT, MAY"
checks:
  - name: spec-files-conform
    description: Spec files satisfy their schemas, are named after their id, and reference scripts that exist
    type: script
    run: per-repo
    script: conformance.sh
    severity: error
  - name: ac-ordered
    description: Each spec's acceptance criteria are ordered by RFC 2119 commitment level (MUST, MUST NOT, SHOULD, SHOULD NOT, MAY)
    type: script
    run: per-repo
    script: ac-order.sh
    severity: error
examples:
  layout: |
    pepperoni-pizza-spex/
      spex.yaml                              # validated against schemas/spex.schema.json
      cs-specs/CS-LIST-PIZZA-MENU.yaml     # validated against schemas/cs-spec.schema.json
      es-specs/ES-NAMING-CONVENTION.yaml # validated against schemas/es-spec.schema.json
      scripts/ES-NAMING-CONVENTION/repo-dir.sh
