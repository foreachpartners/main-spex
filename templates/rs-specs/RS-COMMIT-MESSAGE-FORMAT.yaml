id: RS-COMMIT-MESSAGE-FORMAT
include_for_all_repos: true
managed: true
title: Commit message format
description: >-
  Commits are the unit of traceability between code and the specs that justify
  it. The `fs` scope marks functional commits, and including the affected
  Spec IDs in the Conventional Commit subject or body lets every functional
  change trace back to an approved requirement; the `rs` scope marks rule
  changes. See https://www.conventionalcommits.org/ for the Conventional Commits
  specification.
acceptance_criteria:
  - "MUST use Conventional Commits format `<type>[optional scope]: <description>` with an optional body separated by a blank line"
  - "MUST use the `fs` scope for functional changes (e.g. `feat(fs)`, `fix(fs)`)"
  - "MUST include at least one `<Spec ID>[, <Spec ID>]` in every `fs`-scoped commit description or body"
  - "SHOULD use the `rs` scope for rule changes (e.g. `feat(rs)`, `fix(rs)`)"
checks:
  - name: commit-conventional-format
    description: Recent commits must follow the Conventional Commits subject format
    type: script
    run: per-repo
    script: commit-conventional-format.sh
    severity: warn
  - name: commit-spec-id-trace
    description: Recent `fs`-scoped commits must include a comma-separated Spec ID list
    type: script
    run: per-repo
    script: commit-spec-id-trace.sh
    severity: warn
examples:
  subject: |
    style: format md files
    feat(rs): cache catalog responses for 60s
    feat(fs): list available pizzas FS-LIST-PIZZA-MENU
    fix(fs): reject negative quantities FS-CART-ADD-ITEM, FS-CART-VALIDATE
  with_body: |
    feat(fs): list available pizzas FS-LIST-PIZZA-MENU

    Render the menu from the catalog service and cache results for 60s
    to reduce load on the upstream API.
  spec_ids_in_body: |
    fix(fs): handle empty catalog response

    The catalog service sometimes returns 200 with an empty body
    when no items match the query. Return an empty list instead
    of panicking.

    FS-LIST-PIZZA-MENU, FS-CATALOG-CACHE
