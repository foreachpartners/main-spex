id: TECH-SPEX-CONFORMANCE
include_for_all_repos: false
include_for_spex: true
readonly: true
title: Spec files stay schema-valid
description: >-
  The spex repository is the single source of truth for the project's specs:
  the workspace config in spex.yaml, the business specs in biz-specs/, and the
  technical specs in tech-specs/. When a spec file drifts from its schema, is
  misnamed, or points a check at a script that is not there, every tool and
  agent that reads the spec breaks. Validating the files on every change keeps
  the source dependable.
acceptance_criteria:
  - "[x] MUST validate spex.yaml against schemas/spex.schema.json"
  - "[x] MUST validate every biz-specs/<spec-id>.yaml against schemas/biz-spec.schema.json"
  - "[x] MUST validate every tech-specs/<spec-id>.yaml against schemas/tech-spec.schema.json"
  - "[x] MUST name each spec file <spec-id>.yaml, so the filename stem equals the file's id"
  - "[x] MUST ship every script a tech-spec check references at scripts/<spec-id>/<script>"
  - "[x] MUST order every spec's acceptance criteria by RFC 2119 commitment level: MUST, MUST NOT, SHOULD, SHOULD NOT, MAY"
checks:
  - name: spec-files-conform
    description: Spec files satisfy their schemas, are named after their id, and reference scripts that exist
    type: script
    run: per-repo
    script: conformance.sh
    severity: error
  - name: ac-ordered
    description: Each spec's acceptance criteria are ordered by RFC 2119 commitment level (MUST, MUST NOT, SHOULD, SHOULD NOT, MAY)
    type: script
    run: per-repo
    script: ac-order.sh
    severity: error
examples:
  layout: |
    pepperoni-pizza-spex/
      spex.yaml                              # validated against schemas/spex.schema.json
      biz-specs/BIZ-LIST-PIZZA-MENU.yaml     # validated against schemas/biz-spec.schema.json
      tech-specs/TECH-NAMING-CONVENTION.yaml # validated against schemas/tech-spec.schema.json
      scripts/TECH-NAMING-CONVENTION/repo-dir.sh
status: active
